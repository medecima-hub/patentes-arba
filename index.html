<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Patentes ARBA</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: encabezado con solapas por empresa; debajo un asistente de 5 pasos (stepper a la izquierda, panel a la derecha). */
:root{
  --bg:#f2f5f9; --surface:#ffffff; --ink:#18212f; --muted:#5b6677; --line:#d8dee8; --soft:#e7ecf4;
  --accent:#1b3a6b; --accent-ink:#ffffff;
  --c1:#27744a; --c1-bg:#e2f1e8; --c2:#9a600a; --c2-bg:#faeed6; --c3:#2a64a0; --c3-bg:#e0ecf8;
  --warn:#a9490f; --warn-bg:#fbe9dc; --bad:#a32636; --ok:#27744a;
  --f-display:'Barlow Condensed','Arial Narrow',sans-serif;
  --f-body:'IBM Plex Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
  --f-mono:'IBM Plex Mono',ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0e141d; --surface:#161e2a; --ink:#e5eaf2; --muted:#98a4b6; --line:#2a3546; --soft:#1e2836;
    --accent:#8fb4f0; --accent-ink:#0e141d;
    --c1:#5cc08a; --c1-bg:#14301f; --c2:#e0a64a; --c2-bg:#33250c; --c3:#6fb0ea; --c3-bg:#11273c;
    --warn:#f0a070; --warn-bg:#35200f; --bad:#ef7a88; --ok:#5cc08a; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0e141d; --surface:#161e2a; --ink:#e5eaf2; --muted:#98a4b6; --line:#2a3546; --soft:#1e2836;
  --accent:#8fb4f0; --accent-ink:#0e141d;
  --c1:#5cc08a; --c1-bg:#14301f; --c2:#e0a64a; --c2-bg:#33250c; --c3:#6fb0ea; --c3-bg:#11273c;
  --warn:#f0a070; --warn-bg:#35200f; --bad:#ef7a88; --ok:#5cc08a; color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:14px;line-height:1.5;padding-inline:clamp(16px,3vw,32px);padding-block:20px 48px}
.app{max-width:1180px;margin-inline:auto;display:flex;flex-direction:column;gap:18px}
h1,h2,h3{font-family:var(--f-display);font-weight:600;margin:0;text-wrap:balance;letter-spacing:.01em}
h1{font-size:2.1rem;line-height:1.05}
h2{font-size:1.6rem;line-height:1.1}
h3{font-size:1.15rem}
p{margin:0}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.muted{color:var(--muted)}
.mono{font-family:var(--f-mono)}
.num{font-variant-numeric:tabular-nums}

/* encabezado */
.top{display:flex;flex-direction:column;gap:14px}
.brand{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 16px}
.brand p{color:var(--muted)}
.tabs{display:flex;flex-wrap:wrap;gap:6px}
.tab{display:flex;align-items:center;gap:8px;padding:8px 14px;border:1px solid var(--line);background:var(--surface);border-radius:4px;font-weight:500}
.tab small{color:var(--muted);font-family:var(--f-mono);font-size:.75rem}
.tab[aria-selected="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.tab[aria-selected="true"] small{color:inherit;opacity:.8}
.tab.sep{margin-left:auto}
.tab.lock{opacity:.45;cursor:not-allowed}
.mine{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:8px 0;font-size:14px}
.mine select{padding:6px 8px;border:1px solid var(--line);border-radius:4px;background:var(--surface);color:inherit;font:inherit}

/* asistente */
.wizard{display:grid;grid-template-columns:15.5rem minmax(0,1fr);gap:18px;align-items:start}
.stepper{display:flex;flex-direction:column;border:1px solid var(--line);background:var(--surface);border-radius:6px;overflow:hidden}
.st{display:flex;gap:12px;align-items:center;text-align:left;padding:12px 14px;border:0;border-bottom:1px solid var(--line);background:transparent;min-width:0}
.st:last-child{border-bottom:0}
.st .n{flex:none;width:26px;height:26px;border-radius:50%;border:1.5px solid var(--line);display:grid;place-items:center;font-family:var(--f-mono);font-size:.8rem;color:var(--muted)}
.st .t{display:flex;flex-direction:column;min-width:0;font-weight:500;line-height:1.25}
.st small{color:var(--muted);font-weight:400;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.st.done .n{background:var(--ok);border-color:var(--ok);color:var(--surface)}
.st.on{background:var(--soft)}
.st.on .n{border-color:var(--accent);color:var(--accent)}
.st.done.on .n{color:var(--surface)}
.panel{border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:clamp(16px,2.5vw,26px);display:flex;flex-direction:column;gap:16px;min-width:0}
.panel-head{display:flex;flex-direction:column;gap:4px}
.panel-head p{color:var(--muted);max-width:68ch}
.nav{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;padding-top:6px;border-top:1px solid var(--line)}
.btn{padding:8px 14px;border:1px solid var(--line);background:var(--surface);border-radius:4px;font-weight:500}
.btn:hover{background:var(--soft)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.primary:hover{opacity:.92;background:var(--accent)}
.btn.small{padding:5px 10px;font-size:.85rem}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.tools{display:flex;flex-wrap:wrap;gap:8px;align-items:center}

/* carga de archivos */
.drop{display:flex;flex-direction:column;gap:6px;align-items:center;justify-content:center;text-align:center;padding:34px 16px;border:2px dashed var(--line);border-radius:6px;cursor:pointer;background:var(--bg)}
.drop:hover,.drop.over,.drop:focus-within{border-color:var(--accent);background:var(--soft)}
.drop strong{font-family:var(--f-display);font-size:1.3rem;font-weight:600}
.sr{position:absolute;width:1px;height:1px;opacity:0;overflow:hidden}
.filecard{display:flex;flex-direction:column;gap:14px}
.filehead{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;justify-content:space-between}
.fname{font-family:var(--f-mono);font-weight:500;overflow-wrap:anywhere}
.badge{display:inline-block;padding:1px 8px;border-radius:3px;font-size:.72rem;font-weight:600;letter-spacing:.06em;text-transform:uppercase;background:var(--warn-bg);color:var(--warn)}
.fields{display:grid;grid-template-columns:repeat(auto-fit,minmax(13rem,1fr));gap:12px}
.field{display:flex;flex-direction:column;gap:4px;min-width:0}
.field label{font-size:.75rem;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.field select,.field input{padding:7px 9px;border:1px solid var(--line);border-radius:4px;background:var(--surface);min-width:0;width:100%}
.field.req select.empty{border-color:var(--bad)}
.stats{display:flex;flex-wrap:wrap;gap:6px 18px;padding:10px 12px;background:var(--soft);border-radius:4px}
.stats b{font-variant-numeric:tabular-nums}
.flag{display:inline-block;padding:1px 8px;border-radius:3px;background:var(--warn-bg);color:var(--warn);font-weight:600;font-size:.78rem}
.subtab.warnt:not([aria-selected="true"]){border-color:var(--warn);color:var(--warn)}
.scroll{overflow:auto;max-width:100%;border:1px solid var(--line);border-radius:4px}
table{border-collapse:collapse;width:100%}
th,td{padding:6px 10px;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap}
th{font-size:.72rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);background:var(--soft);position:sticky;top:0;font-weight:600}
th.mapped{color:var(--accent);box-shadow:inset 0 -2px 0 var(--accent)}
td.r,th.r{text-align:right}
tbody tr:last-child td{border-bottom:0}
.plate{font-family:var(--f-mono);font-weight:500;letter-spacing:.06em;border:1.5px solid var(--ink);border-radius:3px;padding:0 6px;background:var(--surface)}

/* reglas y resultado */
.rules{display:grid;grid-template-columns:repeat(auto-fit,minmax(11rem,1fr));gap:12px;padding:14px;border:1px solid var(--line);border-radius:6px;background:var(--bg)}
.check{display:flex;gap:8px;align-items:center;align-self:end;padding-bottom:7px}
.check input{width:auto}
.alerts{display:flex;flex-direction:column;gap:8px}
.alert{padding:9px 12px;border-radius:4px;background:var(--warn-bg);color:var(--warn);border:1px solid color-mix(in srgb,var(--warn) 35%,transparent)}
.alert.info{background:var(--soft);color:var(--ink);border-color:var(--line)}
.cards{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.card{display:flex;flex-direction:column;gap:2px;text-align:left;padding:14px;border:1px solid var(--line);border-radius:6px;background:var(--surface);border-top:4px solid var(--cc);min-width:0}
.card .lab{font-weight:600;line-height:1.25}
.card .cnt{font-family:var(--f-display);font-size:2.4rem;font-weight:600;line-height:1;color:var(--cc);font-variant-numeric:tabular-nums;margin-top:6px}
.card .sub{color:var(--muted);font-size:.82rem}
.card[aria-selected="true"]{background:var(--cb);border-color:var(--cc)}
.c1{--cc:var(--c1);--cb:var(--c1-bg)} .c2{--cc:var(--c2);--cb:var(--c2-bg)} .c3{--cc:var(--c3);--cb:var(--c3-bg)}
.subtabs{display:flex;flex-wrap:wrap;gap:6px}
.subtab{padding:5px 12px;border:1px solid var(--line);border-radius:999px;background:var(--surface);font-size:.85rem}
.subtab[aria-selected="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.listbox{max-height:30rem}
.manual{display:flex;flex-direction:column;gap:8px}
.manual textarea{width:100%;min-height:9rem;font-family:var(--f-mono);font-size:.85rem;padding:8px;border:1px solid var(--line);border-radius:4px;background:var(--surface)}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:4px;font-weight:500;opacity:0;pointer-events:none;transition:opacity .2s;z-index:10;max-width:calc(100vw - 32px)}
.toast.show{opacity:1}
.foot{color:var(--muted);font-size:.82rem}
.resumen td.num,.resumen th.num{text-align:right}
.resumen .tot td{font-weight:600;background:var(--soft)}

.close{display:flex;flex-wrap:wrap;gap:12px;align-items:end;padding:14px;border:1px dashed var(--line);border-radius:6px}
.sav td.zero{color:var(--muted)}
a{color:var(--accent)}
.next{flex-basis:100%;color:var(--ink)}
.next b{font-weight:600}
.months{display:grid;grid-template-columns:repeat(auto-fit,minmax(6.2rem,1fr));gap:8px}
.mon{display:flex;flex-direction:column;gap:2px;padding:8px 10px;border:1px solid var(--line);border-radius:4px;background:var(--surface);min-height:3.6rem}
.mon .mn{font-size:.72rem;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.mon .mv{font-weight:500;font-size:.85rem}
.mon.past{background:var(--bg)}
.mon.past .mv{color:var(--muted);font-weight:400}
.mon.next{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent);background:var(--soft)}
input[type=date]{padding:5px 8px;border:1px solid var(--line);border-radius:4px;background:var(--surface)}
.modes{display:flex;flex-wrap:wrap;gap:6px}
.mode{padding:6px 14px;border:1px solid var(--line);background:var(--surface);border-radius:4px;font-weight:500}
.mode[aria-selected="true"]{border-color:var(--accent);box-shadow:inset 0 -3px 0 var(--accent);font-weight:600}
a.btn{text-decoration:none;display:inline-block;color:inherit}
.field textarea{padding:7px 9px;border:1px solid var(--line);border-radius:4px;background:var(--surface);font-family:var(--f-mono);width:100%;resize:vertical}
.chips{display:flex;flex-wrap:wrap;gap:6px;padding:10px;max-height:10rem}
.how{margin:0;padding-left:1.3rem;display:flex;flex-direction:column;gap:4px}
@media (max-width:820px){
  .wizard{grid-template-columns:minmax(0,1fr)}
  .stepper{flex-direction:row;overflow-x:auto}
  .st{border-bottom:0;border-right:1px solid var(--line);flex:none;max-width:14rem}
  .cards{grid-template-columns:minmax(0,1fr)}
  .tab.sep{margin-left:0}
}
@media (prefers-reduced-motion:reduce){.toast{transition:none}}
</style>

<div class="app" id="app"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script>
(function(){
'use strict';

var EMPRESAS=[{id:'kiara',name:'Kiara'},{id:'ciara',name:'Ciara'},{id:'peara',name:'Peara'},{id:'movilis',name:'Movilis'},{id:'inv',name:'INV Group'}];
var STEPS_ARBA=[
  {key:'arba',title:'Cuenta corriente ARBA',help:'Deuda de patentes de los automotores de la empresa, tal como la baja de ARBA. Cada dominio puede tener varias cuotas; se suman por dominio.'},
  {key:'usados',title:'Stock de usados',help:'Unidades usadas que hoy figuran en el stock de la empresa. Junto con el stock de test drive, sirve para detectar dominios sin preventa que no están en ningún stock.'},
  {key:'td',title:'Stock de test drive',help:'Unidades de test drive de la empresa. Los dominios sin preventa que están acá se pagan como autos propios + test drive.'},
  {key:'exen',title:'Exenciones solicitadas',help:'Dominios con exención pedida por ser comerciante habitualista. La exención rige desde la fecha de titularidad durante los días de vigencia (90 por defecto). Se descartan las vigentes: las pedidas este mes y las de meses anteriores que todavía no vencieron.'},
  {key:'pv',title:'Preventas asignadas',help:'Preventas con dominio asignado y su fecha de entrega. De acá sale qué dominios tienen PV, si es /45 y cuántos días pasaron desde la entrega.'},
  {key:'result',title:'Dominios a pagar',help:''}
];
var STEPS_APR=[
  {key:'arba',title:'Cuenta corriente ARBA',help:'Se usa solo para descartar del circuito municipal los dominios que ya están en ARBA. El resto del stock pasa a la consulta de municipalizados.'},
  {key:'usados',title:'Stock de usados',help:'Unidades usadas del stock. Los dominios que no estén en ARBA se consultan para ver si están municipalizados.'},
  {key:'td',title:'Stock de test drive',help:'Unidades de test drive del stock. Se tratan igual que las usadas.'},
  {key:'muni',title:'Municipalizados',help:''},
  {key:'pv',title:'Preventas asignadas',help:'Solo se cruzan los dominios municipalizados en La Plata. Sin preventa se pagan; con preventa, solo si termina en /45, y la fecha de entrega define si va a cuenta de reventas o bonificada.'},
  {key:'result',title:'Dominios a pagar APR',help:''}
];
var STEPS=STEPS_ARBA;
var FIELDS={
  arba:[{k:'dom',label:'Dominio',req:1},{k:'imp',label:'Importe adeudado'}],
  usados:[{k:'dom',label:'Dominio',req:1},{k:'desc',label:'Descripción / modelo'}],
  td:[{k:'dom',label:'Dominio',req:1},{k:'desc',label:'Descripción / modelo'}],
  exen:[{k:'dom',label:'Dominio',req:1},{k:'tit',label:'Fecha de titularidad'}],
  pv:[{k:'dom',label:'Dominio',req:1},{k:'pv',label:'Nº de preventa',req:1},{k:'ent',label:'Fecha de entrega',req:1}]
};
var HDR={imp:/deuda|adeud|importe|saldo|monto|total/i,desc:/descrip|modelo|marca|unidad|veh[ií]culo/i,pv:/preventa|^pv|n[º°o]?\s*pv|pedido|reserva|orden/i,ent:/entrega/i,tit:/titularidad|titular/i};
var NFILES=5,RES=STEPS.length-1,FILE_KEYS=['arba','usados','td','exen','pv'];
var MESES=['Ene','Feb','Mar','Abr','May','Jun','Jul','Ago','Sep','Oct','Nov','Dic'];
var CATS={
  '1':{name:'Autos propios + test drive',short:'Autos propios + TD'},
  '2':{name:'A cuenta de reventas',short:'A cuenta reventas'},
  '3':{name:'Bonificadas reventas',short:'Bonificadas reventas'}
};
var PLATE_RE=/^([A-Z]{3}\d{3}|[A-Z]{2}\d{3}[A-Z]{2})$/;

function pad(n){return String(n).padStart(2,'0');}
function todayISO(){var d=new Date();return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());}

var state={emp:'kiara',tab:'1',manual:'',opts:{suffix:'/45',days:60,exDias:90,ref:todayISO(),municipio:'La Plata',muniDias:180},mode:'arba',muni:{},muniSample:{},data:{},exen:[],cierres:[],venc:{},vyear:new Date().getFullYear(),per:'',year:new Date().getFullYear(),confirm:'',delConfirm:'',hist:false,saving:false,arch:true,mine:''};
try{var _m=localStorage.getItem('patentes_mine');if(_m&&EMPRESAS.some(function(e){return e.id===_m;})){state.mine=_m;state.emp=_m;}}catch(_e){}
function canEdit(emp){return !state.mine||state.mine===emp;}
function lockMsg(){toast('Esta empresa es de otra persona. Cambiá "Mi empresa" si te corresponde.');}
EMPRESAS.forEach(function(e){state.data[e.id]={step:0,files:{}};});

/* ---------- utilidades de datos ---------- */
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function norm(v){return String(v==null?'':v).toUpperCase().replace(/[^A-Z0-9]/g,'');}
function isPlate(v){return PLATE_RE.test(norm(v));}
function colLetter(i){return i<26?String.fromCharCode(65+i):'Col'+(i+1);}
function parseNum(v){
  if(typeof v==='number')return v;
  var s=String(v==null?'':v).replace(/[^\d.,\-]/g,'');
  if(!s)return 0;
  if(s.indexOf('.')>-1&&s.indexOf(',')>-1)s=s.replace(/\./g,'').replace(',','.');
  else if(s.indexOf(',')>-1)s=s.replace(',','.');
  else if(/^\-?\d{1,3}(\.\d{3})+$/.test(s))s=s.replace(/\./g,'');
  var n=parseFloat(s);return isNaN(n)?0:n;
}
function utc(y,m,d){return Date.UTC(y,m,d);}
function parseDate(v){
  if(v instanceof Date&&!isNaN(v))return utc(v.getFullYear(),v.getMonth(),v.getDate());
  if(typeof v==='number'&&v>20000&&v<80000)return Math.round((v-25569)*864e5);
  if(typeof v==='string'){
    var s=v.trim(),m=s.match(/^(\d{1,2})[\/\-.](\d{1,2})[\/\-.](\d{2,4})/);
    if(m){var y=+m[3];if(y<100)y+=2000;return utc(y,+m[2]-1,+m[1]);}
    m=s.match(/^(\d{4})-(\d{2})-(\d{2})/);
    if(m)return utc(+m[1],+m[2]-1,+m[3]);
  }
  return null;
}
function fmtDate(ms){if(ms==null)return '';var d=new Date(ms);return pad(d.getUTCDate())+'/'+pad(d.getUTCMonth()+1)+'/'+d.getUTCFullYear();}
var money=new Intl.NumberFormat('es-AR',{style:'currency',currency:'ARS',maximumFractionDigits:0});
function fmtMoney(n){return money.format(n||0);}
function refMs(){var m=String(state.opts.ref).match(/^(\d{4})-(\d{2})-(\d{2})$/);return m?utc(+m[1],+m[2]-1,+m[3]):utc(new Date().getFullYear(),new Date().getMonth(),new Date().getDate());}
function csvNum(n){return String(Math.round(n*100)/100).replace('.',',');}

/* ---------- lectura de archivos ---------- */
function detectHeader(aoa){
  for(var i=0;i<Math.min(aoa.length,40);i++){
    if(aoa[i].some(isPlate))return i-1;
  }
  return 0;
}
function dataRows(f){return f.sheets[f.sheet].slice(f.headerRow+1);}
function numCols(f){var a=f.sheets[f.sheet],n=0;for(var i=0;i<Math.min(a.length,200);i++)n=Math.max(n,a[i].length);return n;}
function headers(f){
  var a=f.sheets[f.sheet],n=numCols(f),h=[];
  for(var i=0;i<n;i++){
    var t=f.headerRow>=0&&a[f.headerRow]?String(a[f.headerRow][i]==null?'':a[f.headerRow][i]).trim():'';
    h.push(t||colLetter(i));
  }
  return h;
}
function autoMap(f,type){
  var rows=dataRows(f).slice(0,500),h=headers(f),n=h.length,counts=[],i;
  for(i=0;i<n;i++){counts[i]=0;rows.forEach(function(r){if(isPlate(r[i]))counts[i]++;});}
  var dom=-1,best=0;
  for(i=0;i<n;i++){if(/dominio|patente/i.test(h[i])&&counts[i]>0&&counts[i]>=best){dom=i;best=counts[i];}}
  if(dom<0){for(i=0;i<n;i++){if(counts[i]>best){dom=i;best=counts[i];}}}
  var map={dom:dom},used={};if(dom>=0)used[dom]=1;
  FIELDS[type].forEach(function(fd){
    if(fd.k==='dom')return;
    var pick=-1;
    for(var j=0;j<n;j++){if(!used[j]&&HDR[fd.k]&&HDR[fd.k].test(h[j])){pick=j;break;}}
    if(pick<0&&(fd.k==='ent'||fd.k==='tit')){
      var bc=0;
      for(var c=0;c<n;c++){if(used[c])continue;var k=0;rows.forEach(function(r){if(r[c] instanceof Date)k++;});if(k>bc){bc=k;pick=c;}}
    }
    if(pick<0&&(fd.k==='ent'||fd.k==='tit')){
      for(var q=0;q<n;q++){if(!used[q]&&/fecha/i.test(h[q])){pick=q;break;}}
    }
    map[fd.k]=pick;if(pick>=0)used[pick]=1;
  });
  f.map=map;
}
function parseFile(f,type){
  var m=f.map,rows=dataRows(f),out={map:new Map(),rows:0,invalid:0,dups:0,total:0};
  rows.forEach(function(r){
    if(!r.some(function(c){return c!==''&&c!=null;}))return;
    out.rows++;
    if(m.dom<0){out.invalid++;return;}
    var d=norm(r[m.dom]);
    if(!PLATE_RE.test(d)){out.invalid++;return;}
    var cur=out.map.get(d);
    if(type==='arba'){
      var imp=m.imp>=0?parseNum(r[m.imp]):0;
      if(cur){cur.imp+=imp;cur.n++;out.dups++;}else out.map.set(d,{imp:imp,n:1});
      out.total+=imp;
    }else if(type==='usados'||type==='td'){
      var ds=m.desc>=0?String(r[m.desc]==null?'':r[m.desc]).trim():'';
      if(cur){out.dups++;if(!cur.desc)cur.desc=ds;}else out.map.set(d,{desc:ds});
    }else if(type==='exen'){
      var tit=m.tit>=0?parseDate(r[m.tit]):null;
      if(cur){out.dups++;if(tit!=null&&(cur.tit==null||tit>cur.tit))cur.tit=tit;}else out.map.set(d,{tit:tit});
    }else if(type==='pv'){
      var pv=m.pv>=0?String(r[m.pv]==null?'':r[m.pv]).trim():'';
      var ent=m.ent>=0?parseDate(r[m.ent]):null;
      var rec={pv:pv,ent:ent,n:1};
      if(cur){
        out.dups++;rec.n=cur.n+1;
        var a=cur.ent==null?-Infinity:cur.ent,b=ent==null?-Infinity:ent;
        if(b>=a)out.map.set(d,rec);else cur.n=rec.n;
      }else out.map.set(d,rec);
    }
  });
  return out;
}
function setSheet(f,type){
  var aoa=f.sheets[f.sheet];
  f.headerRow=detectHeader(aoa);
  autoMap(f,type);
  f.parsed=parseFile(f,type);
}
function makeFile(name,sheets,type,sample){
  var names=Object.keys(sheets);
  if(!names.length)return null;
  var f={name:name,sheets:sheets,sheet:names[0],sample:!!sample};
  setSheet(f,type);
  return f;
}

/* ---------- cálculo ---------- */
function ready(emp){return state.data[emp].files.arba&&state.data[emp].files.arba.map.dom>=0;}
function registryFor(emp){
  var m=new Map();
  state.exen.forEach(function(x){
    if(x.empresa!==emp||x.tit==null)return;
    var c=m.get(x.dominio);if(!c||x.tit>c.tit)m.set(x.dominio,{tit:x.tit});
  });
  return m;
}
function compute(emp){
  var files=state.data[emp].files,o=state.opts;
  if(!ready(emp))return null;
  var arba=files.arba.parsed.map,usados=files.usados&&files.usados.parsed.map,td=files.td&&files.td.parsed.map,exen=files.exen&&files.exen.parsed.map,pvs=files.pv&&files.pv.parsed.map;
  var reg=registryFor(emp);
  var stockOk=!!(usados&&td);
  var res={c1:[],c2:[],c3:[],rev:[],excl:[],alertas:[],total:arba.size,stockOk:stockOk,exVenc:0,exHist:0};
  var ref=refMs(),thr=Number(o.days)||0,exd=Number(o.exDias)||0,suf=String(o.suffix||'').trim().toUpperCase();
  arba.forEach(function(a,dom){
    var inU=!!(usados&&usados.has(dom)),inT=!!(td&&td.has(dom));
    var row={dom:dom,imp:a.imp,pv:'',ent:null,dias:null,desc:'',motivo:'',nota:'',origen:inU&&inT?'Usados + TD':inU?'Usados':inT?'Test drive':'',alerta:false,exento:false,tit:null,hasta:null};
    row.desc=(inU&&usados.get(dom).desc)||(inT&&td.get(dom).desc)||'';
    var ex=exen&&exen.get(dom),fuente='archivo';
    if(!ex&&reg.has(dom)){ex={tit:reg.get(dom).tit};fuente='historial';}
    if(ex){
      var hasta=ex.tit==null?null:ex.tit+exd*864e5;
      if(hasta==null||ref<=hasta){
        row.motivo=(hasta==null?'Exención solicitada (sin fecha de titularidad)':'Exención vigente hasta '+fmtDate(hasta))+(fuente==='historial'?' (del historial)':'');
        row.exento=true;row.tit=ex.tit;row.hasta=hasta;
        if(fuente==='historial')res.exHist++;
        res.excl.push(row);return;
      }
      if(fuente==='archivo'){row.nota='Exención vencida el '+fmtDate(hasta);res.exVenc++;}
    }
    var pv=pvs&&pvs.get(dom);
    if(!pv){
      if(stockOk&&!inU&&!inT){row.alerta=true;row.nota=(row.nota?row.nota+' · ':'')+'Sin preventa y fuera de stock de usados y TD';res.alertas.push(row);}
      res.c1.push(row);return;
    }
    row.pv=pv.pv;row.ent=pv.ent;
    if(suf&&pv.pv.toUpperCase().indexOf(suf,pv.pv.length-suf.length)<0||(suf&&pv.pv.length<suf.length)){
      row.motivo='Preventa que no es '+o.suffix;res.excl.push(row);return;
    }
    if(pv.ent==null){row.motivo='Preventa '+o.suffix+' sin fecha de entrega';res.rev.push(row);return;}
    row.dias=Math.floor((ref-pv.ent)/864e5);
    if(row.dias<0){row.motivo='Fecha de entrega posterior a la fecha de referencia';res.rev.push(row);return;}
    if(row.dias>thr)res.c2.push(row);else res.c3.push(row);
  });
  ['c1','c2','c3','rev','excl','alertas'].forEach(function(k){
    res[k].sort(function(a,b){return a.dom<b.dom?-1:1;});
    res[k+'Imp']=res[k].reduce(function(s,r){return s+r.imp;},0);
  });
  res.pagar=res.c1.length+res.c2.length+res.c3.length;
  res.pagarImp=res.c1Imp+res.c2Imp+res.c3Imp;
  return res;
}
function catKey(t){return t==='1'?'c1':t==='2'?'c2':t==='3'?'c3':t==='alert'?'alertas':t;}
function catLabel(t){return t==='rev'?'A revisar':t==='excl'?'No se pagan':t==='alert'?'Alertas de revisión':t==='pend'?'Por consultar':CATS[t].name;}

    var ta=document.createElement('textarea');ta.value=text;ta.style.position='fixed';ta.style.opacity='0';document.body.appendChild(ta);ta.select();

function loadExample(emp){
  var seed=0;emp.split('').forEach(function(c){seed=(seed*31+c.charCodeAt(0))>>>0;});seed=(seed+7)>>>0;
  function rnd(){seed=(seed*1664525+1013904223)>>>0;return seed/4294967296;}
  var L='ABCDEFGHJKLMNPRSTVWXYZ';
  function ls(n){var s='';for(var i=0;i<n;i++)s+=L[Math.floor(rnd()*L.length)];return s;}
  function dg(n){return String(Math.floor(rnd()*Math.pow(10,n))).padStart(n,'0');}
  function plate(){return rnd()<0.25?ls(3)+dg(3):ls(2)+dg(3)+ls(2);}
  var set={},P=[];
  while(P.length<16){var p=plate();if(!set[p]){set[p]=1;P.push(p);}}
  var ref=refMs();

/* ---------- guardado (db, assets, downloads) ---------- */
var cap={db:null,assets:null,downloads:null},renderTimer;
function softRender(){clearTimeout(renderTimer);renderTimer=setTimeout(render,120);}
function empName(id){var e=EMPRESAS.filter(function(x){return x.id===id;})[0];return e?e.name:id;}
function ymd(ms){var d=new Date(ms);return d.getUTCFullYear()+pad(d.getUTCMonth()+1)+pad(d.getUTCDate());}
function perDefault(){return state.per||String(state.opts.ref).slice(0,7);}
function doms(a){return a.map(function(x){return x.dom;});}
function dbMsg(e){
  var c=e&&e.code;
  return c==='quota_exceeded'?'Se llenó el espacio de la base. Eliminá cierres viejos.':c==='invalid_argument'?'No tenés permiso para guardar en esta página.':c==='resource_exhausted'?'Demasiadas operaciones seguidas. Esperá un momento y reintentá.':'No se pudo guardar. Reintentá en unos segundos.';
}
function toCsv(aoa){
  return aoa.map(function(r){return r.map(function(c){
    if(c instanceof Date)c=fmtDate(parseDate(c));
    var t=String(c==null?'':c);
    return /[",\n;]/.test(t)?'"'+t.replace(/"/g,'""')+'"':t;
  }).join(',');}).join('\n');
}
function fromSnap(s){return s.docs.map(function(d){return Object.assign({},d.data(),{_id:d.id});});}
function subscribeDb(){
  cap.db.collection('exenciones').onSnapshot(function(s){state.exen=fromSnap(s);softRender();},function(){softRender();});
  cap.db.collection('cierres').onSnapshot(function(s){state.cierres=fromSnap(s);softRender();},function(){softRender();});
  cap.db.collection('municipios').onSnapshot(function(s){
    var o={};
    s.docs.forEach(function(d){var x=d.data();if(x&&x.dominio)o[x.dominio]={m:!!x.municipalizado,mun:x.municipio||'',f:Number(x.consultadoEn)||0};});
    state.muni=o;softRender();
  },function(){softRender();});
  cap.db.collection('config').onSnapshot(function(s){
    s.docs.forEach(function(d){var x=d.data();if(x&&x.anio&&Array.isArray(x.fechas))state.venc[(x.tipo==='apr'?'apr':'')+x.anio]=x.fechas.slice();});
    softRender();
  },function(){softRender();});
}
function initCaps(){
  if(!window.claude||typeof window.claude.use!=='function')return;
  window.claude.use('db').then(function(db){if(db){cap.db=db;subscribeDb();softRender();}}).catch(function(){});
  window.claude.use('assets').then(function(a){if(a){cap.assets=a;softRender();}}).catch(function(){});
  window.claude.use('downloads').then(function(x){if(x){cap.downloads=x;softRender();}}).catch(function(){});
}
async function closeMonth(emp){
  var per=perDefault();
  if(!/^\d{4}-(0[1-9]|1[0-2])$/.test(per)){toast('Elegí un período válido (AAAA-MM).');return;}
  var apr=state.mode==='apr',d=state.data[emp],r=apr?computeApr(emp):compute(emp);
  if(!r||!cap.db)return;
  if(!canEdit(emp)){lockMsg();return;}
  var o=state.opts,anio=+per.slice(0,4),cid=emp+(apr?'_apr_':'_')+per;
  state.saving=true;render();
  try{
    var old=state.cierres.filter(function(c){return c._id===cid;})[0];
    var archivos=Object.assign({},old&&old.archivos||{}),fails=0,i,j;
    if(state.arch&&cap.assets){
      for(i=0;i<FILE_KEYS.length;i++){
        var k=FILE_KEYS[i],f=d.files[k];
        if(!f||f.sample||(apr&&k==='exen'))continue;
        try{
          var blob=new Blob(['﻿'+toCsv(f.sheets[f.sheet])],{type:'text/csv'});
          var up=await cap.assets.upload(blob,{type:'text/csv'});
          if(archivos[k]&&archivos[k].id){try{await cap.assets.delete(archivos[k].id);}catch(e1){}}
          archivos[k]={id:up.id,name:f.name,filas:f.parsed.rows};
        }catch(e2){fails++;}
      }
    }
    var exRows=apr?[]:r.excl.filter(function(x){return x.exento;}),nuevas=0;
    for(j=0;j<exRows.length;j++){
      var x=exRows[j],tk=x.tit==null?'sf'+anio:ymd(x.tit),did=emp+'_'+x.dom+'_'+tk;
      var cur=state.exen.filter(function(e){return e._id===did;})[0];
      if(cur){if(cur.ultimo!==per)await cap.db.doc('exenciones/'+did).update({ultimo:per});}
      else{await cap.db.doc('exenciones/'+did).set({empresa:emp,dominio:x.dom,tit:x.tit,hasta:x.hasta,imp:x.imp,periodo:per,anio:anio,ultimo:per});nuevas++;}
    }
    await cap.db.doc('cierres/'+cid).set({
      empresa:emp,tipo:apr?'apr':'arba',periodo:per,anio:anio,cerradoEn:new Date().toISOString(),ref:refMs(),
      reglas:{suffix:o.suffix,days:o.days,exDias:o.exDias,municipio:o.municipio},
      total:r.total,pagar:r.pagar,pagarImp:r.pagarImp||0,c1Imp:r.c1Imp||0,c2Imp:r.c2Imp||0,c3Imp:r.c3Imp||0,
      c1:doms(r.c1),c2:doms(r.c2),c3:doms(r.c3),rev:doms(r.rev),alertas:doms(r.alertas),pend:doms(r.pend||[]),
      exentosN:exRows.length,exentosImp:exRows.reduce(function(s,y){return s+y.imp;},0),archivos:archivos
    });
    toast('Cierre'+(apr?' APR':'')+' de '+empName(emp)+' '+per+' guardado'+(nuevas?'. Exenciones nuevas contadas: '+nuevas:'')+(fails?'. '+fails+' archivo(s) no se pudieron guardar':''));
  }catch(e){toast(dbMsg(e));}
  state.saving=false;render();
}

  var c=state.cierres.filter(function(x){return x._id===id;})[0];
  if(!c||!cap.db)return;

function curCompute(emp){return state.mode==='apr'?computeApr(emp):compute(emp);}
function setMode(m){
  if(m===state.mode)return;
  EMPRESAS.forEach(function(e){var d=state.data[e.id];d['step_'+state.mode]=d.step;d.step=d['step_'+m]||0;});

  }).join('')+'</div>';

function aprBase(emp){
  var f=state.data[emp].files;
  if(!ready(emp)||!(f.usados||f.td))return null;
  var arba=f.arba.parsed.map,c=new Map();
  [f.usados&&f.usados.parsed.map,f.td&&f.td.parsed.map].forEach(function(mp,idx){
    if(!mp)return;
    mp.forEach(function(v,dom){
      if(arba.has(dom))return;
      var cur=c.get(dom)||{inU:false,inT:false,desc:''};
      if(idx===0)cur.inU=true;else cur.inT=true;
      cur.desc=cur.desc||v.desc||'';
      c.set(dom,cur);
    });
  });
  return {cands:c,arbaN:arba.size};
}
function muniGet(dom){
  var m=state.muni[dom]||state.muniSample[dom];
  if(!m)return null;
  var lim=Number(state.opts.muniDias)||0;
  if(lim&&m.f&&!m.s&&(Date.now()-m.f)/864e5>lim)return null;
  return m;
}
function muniPending(emp){
  var b=aprBase(emp);if(!b)return null;
  var a=[];b.cands.forEach(function(c,dom){if(!muniGet(dom))a.push(dom);});
  return a.sort();
}
function muniDone(emp){var p=muniPending(emp);return p!=null&&p.length===0;}
function computeApr(emp){
  var b=aprBase(emp);if(!b)return null;
  var f=state.data[emp].files,pvs=f.pv&&f.pv.parsed.map,o=state.opts;
  var ref=refMs(),thr=Number(o.days)||0,suf=String(o.suffix||'').trim().toUpperCase(),mun=String(o.municipio||'La Plata').trim().toUpperCase();
  var res={c1:[],c2:[],c3:[],rev:[],excl:[],alertas:[],pend:[],total:b.cands.size,stockOk:!!(f.usados&&f.td),exVenc:0,exHist:0};
  b.cands.forEach(function(c,dom){
    var row={dom:dom,imp:0,pv:'',ent:null,dias:null,desc:c.desc,motivo:'',nota:'',origen:c.inU&&c.inT?'Usados + TD':c.inU?'Usados':'Test drive',alerta:false,exento:false,tit:null,hasta:null};
    var m=muniGet(dom);
    if(!m){row.motivo='Sin consulta de municipalización';res.pend.push(row);return;}
    if(!m.m){row.motivo='No municipalizado';res.excl.push(row);return;}
    if(String(m.mun||'').toUpperCase().indexOf(mun)<0){row.motivo='Municipalizado en '+(m.mun||'otro municipio');res.excl.push(row);return;}
    var pv=pvs&&pvs.get(dom);
    if(!pv){res.c1.push(row);return;}
    row.pv=pv.pv;row.ent=pv.ent;
    if(suf&&pv.pv.toUpperCase().indexOf(suf,pv.pv.length-suf.length)<0||(suf&&pv.pv.length<suf.length)){
      row.motivo='Preventa que no es '+o.suffix;res.excl.push(row);return;
    }
    if(pv.ent==null){row.motivo='Preventa '+o.suffix+' sin fecha de entrega';res.rev.push(row);return;}
    row.dias=Math.floor((ref-pv.ent)/864e5);
    if(row.dias<0){row.motivo='Fecha de entrega posterior a la fecha de referencia';res.rev.push(row);return;}
    if(row.dias>thr)res.c2.push(row);else res.c3.push(row);
  });
  ['c1','c2','c3','rev','excl','alertas','pend'].forEach(function(k){
    res[k].sort(function(a,b){return a.dom<b.dom?-1:1;});
    res[k+'Imp']=0;
  });
  res.pagar=res.c1.length+res.c2.length+res.c3.length;res.pagarImp=0;
  return res;
}
async function pasteMuni(text){
  var lines=String(text||'').split(/\r?\n/),list=[],skip=0;
  lines.forEach(function(ln){
    if(!ln.trim())return;
    var m=ln.match(/([A-Za-z]{3}[\s\-]?\d{3}|[A-Za-z]{2}[\s\-]?\d{3}[\s\-]?[A-Za-z]{2})/);
    if(!m){skip++;return;}
    var dom=norm(m[1]);if(!PLATE_RE.test(dom)){skip++;return;}
    var rest=ln.slice(m.index+m[1].length).replace(/^[\s,;:\t\-]+/,'').trim();
    if(!rest){skip++;return;}
    if(/^ERROR\b/i.test(rest)||/^\(sin texto nuevo\)/i.test(rest)){skip++;return;}
    var cols=rest.split(/\t+/),c0=cols[0].trim();
    if(/^(si|sí)$/i.test(c0)){list.push({dom:dom,m:true,mun:(cols[1]||'').trim().slice(0,160)||'Sin dato de municipio'});return;}
    if(/^no$/i.test(c0)){list.push({dom:dom,m:false,mun:''});return;}
    var isNo=/^(no|n)$/i.test(rest)||/\bno\b.{0,40}municipaliz/i.test(rest)||/sin\s+municipaliz/i.test(rest)||/\bno\s+(se\s+)?(encontr|registra|figura|existe)/i.test(rest);
    list.push({dom:dom,m:!isNo,mun:isNo?'':rest.slice(0,160)});
  });
  if(!list.length){toast('No encontré dominios con resultado. Usá una línea por dominio: dominio y municipio, o dominio y NO.');return;}
  var now=Date.now(),fails=0;
  list.forEach(function(x){state.muni[x.dom]={m:x.m,mun:x.mun,f:now};});
  render();
  if(cap.db){
    for(var i=0;i<list.length;i++){
      try{await cap.db.doc('municipios/'+list[i].dom).set({dominio:list[i].dom,municipalizado:list[i].m,municipio:list[i].mun,consultadoEn:now});}
      catch(e){fails++;}
    }
  }
  toast('Se cargaron '+list.length+' resultados'+(skip?'. Líneas ignoradas: '+skip:'')+(fails?'. No se pudieron guardar '+fails+' en la base':''));
}

  h+='<div class="tools"><h3>'+esc(catLabel(tab))+'</h3><span class="muted">'+rows.length+' dominios</span><span style="margin-left:auto"></span><button class="btn small" data-a="copy" data-k="doms"'+(rows.length?'':' disabled')+'>Copiar dominios</button><button class="btn small" data-a="copy" data-k="table"'+(rows.length?'':' disabled')+'>Copiar tabla</button>'+(canXlsx()?'<button class="btn small" data-a="xlsx">Descargar Excel</button>':'')+'</div>';
  if(!rows.length)h+='<div class="alert info">No hay dominios en esta categoría.</div>';
  else{
    h+='<div class="scroll listbox"><table><thead><tr><th>Dominio</th>'+(showStock?'<th>Stock</th>':'')+(showPv?'<th>Preventa</th><th>Entrega</th><th class="r">Días</th>':'')+'<th>Descripción</th>'+(anyObs?'<th>Observación</th>':'')+'</tr></thead><tbody>';
    rows.forEach(function(x){
      h+='<tr><td><span class="plate">'+esc(x.dom)+'</span></td>'+(showStock?'<td>'+esc(x.origen)+'</td>':'')+(showPv?'<td class="mono">'+esc(x.pv)+'</td><td class="num">'+esc(fmtDate(x.ent))+'</td><td class="r num">'+(x.dias==null?'':x.dias)+'</td>':'')+'<td>'+esc(x.desc)+'</td>'+(anyObs?'<td>'+esc(obs(x))+'</td>':'')+'</tr>';
    });
    h+='</tbody></table></div>';
  }
  return h+'<div class="nav"><button class="btn" data-a="prev">Anterior</button><span></span></div>';
}
async function consultaFn(dominios){
  var all=Array.from(document.querySelectorAll('form input'));
  var campo=all.find(function(x){return /dominio/i.test((x.name||'')+(x.id||''));})||all.find(function(x){return x.type==='text'||!x.type;});
  if(!campo||!campo.form||!campo.name){console.error('No encontré el campo Dominio. Abrí la página de consulta de ARBA y volvé a pegar el script.');return;}
  var form=campo.form;
  function textos(html){
    var doc=new DOMParser().parseFromString(html,'text/html');
    doc.querySelectorAll('script,style').forEach(function(n){n.remove();});
    var w=doc.createTreeWalker(doc.body,4),out=[],n;
    while((n=w.nextNode())){var t=n.nodeValue.replace(/\s+/g,' ').trim();if(t)out.push(t);}
    return out;
  }
  function valorDe(t,etiqueta){
    for(var k=0;k<t.length-1;k++){if(etiqueta.test(t[k])){return /^volver$/i.test(t[k+1])?'':t[k+1];}}
    return null;
  }
  function limpio(v){return String(v||'').replace(/[^A-Za-z0-9]/g,'').toUpperCase();}
  function pausa(ms){return new Promise(function(r){setTimeout(r,ms);});}
  var base=new Set(textos(await (await fetch(location.href,{credentials:'same-origin'})).text()));
  var btn=Array.from(form.elements).find(function(x){return (x.type==='submit'||x.type==='button'||x.type==='image')&&/enviar/i.test((x.value||'')+(x.textContent||''));});
  var metodo=(form.getAttribute('method')||'get').toUpperCase();
  var filas=[];
  for(var i=0;i<dominios.length;i++){
    var d=dominios[i],texto;
    try{
      var fd=new FormData(form);fd.set(campo.name,d);
      if(btn&&btn.name)fd.set(btn.name,btn.value);
      var url=form.getAttribute('action')||location.href,opts={credentials:'same-origin'};
      if(metodo==='GET'){var u=new URL(url,location.href);fd.forEach(function(v,k){u.searchParams.set(k,v);});url=u.toString();opts.method='GET';}
      else{opts.method='POST';opts.body=new URLSearchParams(fd);opts.headers={'Content-Type':'application/x-www-form-urlencoded'};}
      var res=await fetch(url,opts);
      var t=textos(await res.text());
      var eco=valorDe(t,/^dominio:?$/i),mz=valorDe(t,/^municipalizado:?$/i),mu=valorDe(t,/^municipio:?$/i);
      if(mz!==null){
        if(eco&&limpio(eco)!==limpio(d))texto='ERROR respuesta de otro dominio ('+eco+')';
        else texto=mz.toUpperCase()+'\t'+(mu||'');
      }else{
        texto=t.filter(function(x){return !base.has(x);}).join(' | ').slice(0,200)||'(sin texto nuevo)';
      }
      if(!res.ok)texto='ERROR HTTP '+res.status+' '+texto;
    }catch(err){texto='ERROR '+err.message;}
    filas.push(d+'\t'+texto);
    console.log((i+1)+'/'+dominios.length,d,texto);
    await pausa(800);
  }
  var salida=filas.join('\n');
  try{copy(salida);console.log('Listo: el resultado quedó copiado. Pegalo en Patentes ARBA.');}
  catch(err){console.log('Listo. Copiá este texto y pegalo en Patentes ARBA:\n'+salida);}
  return salida;
}
function consultaScript(list){return '('+consultaFn.toString()+')('+JSON.stringify(list)+');';}
function samplePlates(emp,n){
  var seed=0;emp.split('').forEach(function(c){seed=(seed*31+c.charCodeAt(0))>>>0;});seed=(seed+11)>>>0;
  function rnd(){seed=(seed*1664525+1013904223)>>>0;return seed/4294967296;}
  var L='ABCDEFGHJKLMNPRSTVWXYZ',set={},P=[];
  function ls(k){var t='';for(var i=0;i<k;i++)t+=L[Math.floor(rnd()*L.length)];return t;}
  function dg(k){return String(Math.floor(rnd()*Math.pow(10,k))).padStart(k,'0');}
  while(P.length<n){var p=rnd()<0.5?ls(3)+dg(3):ls(2)+dg(3)+ls(2);if(!set[p]){set[p]=1;P.push(p);}}
  return P;
}
function loadExampleApr(emp){
  var P=samplePlates(emp,16),ref=refMs(),i,models=['Hilux SRV','Ranger XLT','Corolla XEI','Yaris S','SW4 SRX','Etios X'];
  function ago(n){var x=new Date(ref-n*864e5);return pad(x.getUTCDate())+'/'+pad(x.getUTCMonth()+1)+'/'+x.getUTCFullYear();}
  var arba=[['Cuenta corriente ARBA - Automotores (EJEMPLO)'],['Dominio','Período','Importe adeudado']];
  for(i=0;i<6;i++)arba.push([P[i],'2026/5',120000+i*15000]);
  var usados=[['Dominio','Unidad','Estado']];
  [0,1,6,7,8,9,10,11].forEach(function(k){usados.push([P[k],models[k%models.length],'Disponible']);});
  var tdv=[['Dominio','Unidad','Estado']];
  [2,12,13].forEach(function(k){tdv.push([P[k],models[k%models.length],'Test drive']);});
  var pv=[['Dominio','Nº de preventa','Fecha de entrega'],[P[7],'1021/45',ago(20)],[P[8],'1034/45',ago(130)],[P[9],'0954/12',ago(40)],[P[12],'1120/45','']];
  var d=state.data[emp];
  d.files.arba=makeFile('ejemplo-cuenta-corriente-arba.xlsx',{Hoja1:arba},'arba',true);
  d.files.usados=makeFile('ejemplo-stock-usados.xlsx',{Hoja1:usados},'usados',true);
  d.files.td=makeFile('ejemplo-stock-td.xlsx',{Hoja1:tdv},'td',true);
  d.files.pv=makeFile('ejemplo-preventas.xlsx',{Hoja1:pv},'pv',true);
  state.muniSample={};
  [6,7,8,9,12].forEach(function(k){state.muniSample[P[k]]={m:true,mun:'La Plata',f:0,s:true};});
  state.muniSample[P[10]]={m:false,mun:'',f:0,s:true};
  state.muniSample[P[11]]={m:true,mun:'Berisso',f:0,s:true};
  d.step=RES;state.tab='1';
  render();
  toast('Se cargaron datos de ejemplo. Reemplazalos con tus archivos.');
}

document.addEventListener('click',function(e){
  var t=e.target.closest('[data-a]');if(!t||t.disabled)return;
  var a=t.dataset.a,d=state.data[state.emp];
  if(a==='emp'){if(t.dataset.id!=='resumen'&&!canEdit(t.dataset.id)){lockMsg();return;}state.emp=t.dataset.id;state.tab='1';state.manual='';}
  else if(a==='step'){d.step=+t.dataset.i;}
  else if(a==='go'){if(!canEdit(t.dataset.id)){lockMsg();return;}state.emp=t.dataset.id;state.data[t.dataset.id].step=+t.dataset.i;}
  else if(a==='next'){d.step=Math.min(RES,d.step+1);}
  else if(a==='prev'){d.step=Math.max(0,d.step-1);}
  else if(a==='remove'){delete d.files[t.dataset.key];}
  else if(a==='example'){if(state.mode==='apr')loadExampleApr(state.emp);else loadExample(state.emp);return;}
  else if(a==='tab'){state.tab=t.dataset.v;}
  else if(a==='closeman'){state.manual='';}
  else if(a==='hist'){state.hist=!state.hist;}
  else if(a==='cerrar'){state.confirm=state.emp+(state.mode==='apr'?'_apr_':'_')+perDefault();}
  else if(a==='cerrarno'){state.confirm='';}
  else if(a==='cerrarok'){state.confirm='';closeMonth(state.emp);return;}
  else if(a==='delc'){state.delConfirm=t.dataset.id;}
  else if(a==='delcno'){state.delConfirm='';}
  else if(a==='delcyes'){delCierre(t.dataset.id);return;}
  else if(a==='copyc'){
    var cc=state.cierres.filter(function(x){return x._id===t.dataset.id;})[0];
    if(cc){var ls=['Categoría\tDominio'];['1','2','3'].forEach(function(n){(cc['c'+n]||[]).forEach(function(dm){ls.push(CATS[n].name+'\t'+dm);});});copyText(ls.join('\n'),'Se copiaron los dominios del cierre');}
    return;
  }
  else if(a==='xlsx'){xlsxEmpresa(state.emp);return;}
  else if(a==='xlsxall'){xlsxTodas();return;}
  else if(a==='mode'){setMode(t.dataset.v);}
  else if(a==='munipaste'){var mta=document.getElementById('muni-in');pasteMuni(mta?mta.value:'');return;}
  else if(a==='copyscript'){var ps=muniPending(state.emp)||[];copyText(consultaScript(ps),'Se copió el script con '+ps.length+' dominios');return;}
  else if(a==='copymuni'){var pl=muniPending(state.emp)||[];copyText(pl.join('\n'),'Se copiaron '+pl.length+' dominios');return;}
  else if(a==='vadd'){
    var y1=state.vyear,l1=vencList(y1).slice(),lm=l1.length?isoMs(l1[l1.length-1]):null,nx;
    if(lm==null)nx=Date.UTC(y1,0,10);else{var ld=new Date(lm);nx=Date.UTC(ld.getUTCFullYear(),ld.getUTCMonth()+(state.mode==='apr'?2:1),ld.getUTCDate());}
    l1.push(new Date(nx).toISOString().slice(0,10));state.venc[vk(y1)]=l1;saveVenc(y1);
  }
  else if(a==='vdel'){var y2=state.vyear,l2=vencList(y2).slice();l2.pop();state.venc[vk(y2)]=l2;saveVenc(y2);}
  else if(a==='vreset'){delete state.venc[vk(state.vyear)];saveVenc(state.vyear);}
  else if(a==='copy'){
    var k=t.dataset.k,r;
    if(k==='alldoms'){copyText(allText(),'Se copiaron todos los dominios a pagar');return;}
    if(k==='summary'){copyText(summaryText(),'Se copió el resumen');return;}
    r=curCompute(state.emp);if(!r)return;
    var rows=r[catKey(state.tab)],hasImp=state.mode!=='apr'&&d.files.arba.map.imp>=0;
    if(k==='doms')copyText(rows.map(function(x){return x.dom;}).join('\n'),'Se copiaron '+rows.length+' dominios');
    else copyText(tableText(state.tab,rows,hasImp),'Se copió la tabla');
    return;
  }
  render();
});
document.addEventListener('change',function(e){
  var t=e.target,d=state.data[state.emp];
  if(t.dataset.mine){state.mine=t.value;try{if(t.value)localStorage.setItem('patentes_mine',t.value);else localStorage.removeItem('patentes_mine');}catch(_e){}if(t.value)state.emp=t.value;state.tab='1';state.manual='';render();return;}
  if(t.dataset.file){if(t.files&&t.files[0])loadFileInto(state.emp,t.dataset.file,t.files[0]);return;}
  if(t.dataset.sheet){var f=d.files[t.dataset.sheet];f.sheet=t.value;setSheet(f,t.dataset.sheet);render();return;}
  if(t.dataset.hdr){var g=d.files[t.dataset.hdr];g.headerRow=Math.max(-1,(parseInt(t.value,10)||0)-1);autoMap(g,t.dataset.hdr);g.parsed=parseFile(g,t.dataset.hdr);render();return;}
  if(t.dataset.col){var h=d.files[t.dataset.col];h.map[t.dataset.field]=parseInt(t.value,10);h.parsed=parseFile(h,t.dataset.col);render();return;}

  if(t.dataset.opt){
    var k=t.dataset.opt;
    if(k==='exDias')state.opts.exDias=Math.max(0,parseInt(t.value,10)||0);
    else if(k==='days')state.opts.days=Math.max(0,parseInt(t.value,10)||0);

    else if(k==='per'){state.per=t.value;state.confirm='';}
    else if(k==='arch')state.arch=t.checked;
    else if(k==='year')state.year=parseInt(t.value,10)||state.year;
    else if(k==='vyear')state.vyear=parseInt(t.value,10)||state.vyear;
    else if(k==='municipio')state.opts.municipio=t.value;
    else if(k==='muniDias')state.opts.muniDias=Math.max(0,parseInt(t.value,10)||0);
    else state.opts.suffix=t.value;
    render();
  }
});
